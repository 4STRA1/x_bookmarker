<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タグのバックアップ</title>
<style>
  :root{--bg:#161b2e;--surface:#1f2640;--line:#38416a;--text:#ecebf2;--muted:#9ba1c0;--accent:#f0b429;--on-accent:#1a1400;--ok:#8fe3a0;--ng:#ff8080}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:15px/1.7 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;display:grid;gap:14px}
  h1{font-size:1.1rem;margin:0}
  section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
  h2{font-size:.9rem;margin:0;color:var(--muted);font-weight:600}
  button,label.btn{appearance:none;border:1px solid var(--line);background:#29314f;color:var(--text);border-radius:10px;min-height:46px;padding:0 14px;font:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
  input[type=file]{display:none}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
  dt{color:var(--muted)} dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  #msg{white-space:pre-wrap;min-height:1.7em;margin:0;font-size:.88rem}
  .ok{color:var(--ok)} .ng{color:var(--ng)}
  small{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>タグのバックアップ / 復元</h1>

  <section>
    <h2>現在の状態</h2>
    <dl>
      <dt>投稿</dt><dd id="n-posts">-</dd>
      <dt>タグ付き投稿</dt><dd id="n-tags">-</dd>
      <dt>永続ストレージ</dt><dd id="persist">-</dd>
    </dl>
    <button id="btn-persist" type="button">永続ストレージを要求する</button>
    <button id="btn-refresh" type="button">再読み込み</button>
  </section>

  <section>
    <h2>書き出し</h2>
    <button id="ex-tags" class="primary" type="button">タグをJSONで保存</button>
    <button id="ex-posts" type="button">投稿をJSONで保存</button>
    <small>タグは投稿IDに紐づくため、投稿を再読み込みした後でも復元できます。</small>
  </section>

  <section>
    <h2>タグの復元</h2>
    <label class="btn" for="im-tags">タグのJSONを選んで復元</label>
    <input id="im-tags" type="file" accept=".json,application/json">
    <small>既存のタグは削除しません。同じ投稿にタグがある場合は、バックアップ側の内容で上書きします。投稿が存在しないIDはスキップします。</small>
  </section>

  <p id="msg" role="status"></p>
</main>

<script>
'use strict';
const DB_NAME = 'xbm-viewer';
const $ = (id) => document.getElementById(id);
const say = (t, cls = '') => { const m = $('msg'); m.textContent = t; m.className = cls; };

/* 存在するDBだけ開く(無いDBを開いて空のDBを作らないため) */
async function openDb() {
  if (indexedDB.databases) {
    const list = await indexedDB.databases();
    if (!list.some((d) => d.name === DB_NAME)) throw new Error('データベースが見つかりません');
  }
  return new Promise((ok, ng) => {
    const r = indexedDB.open(DB_NAME);
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ng(r.error);
    r.onblocked = () => ng(new Error('他のタブが使用中です。他のタブを閉じてください'));
  });
}
const req = (r) => new Promise((ok, ng) => { r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); });
const getAll = async (store) => { const db = await openDb(); try { return await req(db.transaction(store).objectStore(store).getAll()); } finally { db.close(); } };

function download(name, data) {
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 15000);
}
const stamp = () => new Date().toISOString().slice(0, 10);

async function refresh() {
  try {
    const db = await openDb();
    const c = async (s) => req(db.transaction(s).objectStore(s).count());
    $('n-posts').textContent = await c('posts');
    $('n-tags').textContent = await c('tags');
    db.close();
  } catch (e) { say(`状態を取得できません: ${e.message || e}`, 'ng'); }
  try { $('persist').textContent = navigator.storage?.persisted ? String(await navigator.storage.persisted()) : '非対応'; } catch { $('persist').textContent = '不明'; }
}

$('btn-refresh').onclick = refresh;

$('btn-persist').onclick = async () => {
  if (!navigator.storage?.persist) return say('このブラウザは永続ストレージの要求に対応していません', 'ng');
  const ok = await navigator.storage.persist();
  say(ok ? '永続ストレージが許可されました' : '許可されませんでした。ホーム画面に追加すると許可されやすくなります', ok ? 'ok' : 'ng');
  refresh();
};

$('ex-tags').onclick = async () => {
  try {
    const rows = await getAll('tags');
    if (!rows.length) return say('タグが0件のため保存しませんでした', 'ng');
    download(`xbm-tags-${stamp()}.json`, { kind: 'xbm-tags', version: 1, exportedAt: new Date().toISOString(), tags: rows });
    say(`タグ ${rows.length}件を書き出しました`, 'ok');
  } catch (e) { say(`書き出しに失敗: ${e.message || e}`, 'ng'); }
};

$('ex-posts').onclick = async () => {
  try {
    const rows = await getAll('posts');
    if (!rows.length) return say('投稿が0件のため保存しませんでした', 'ng');
    download(`xbm-posts-${stamp()}.json`, { version: 1, exportedAt: new Date().toISOString(), posts: rows });
    say(`投稿 ${rows.length}件を書き出しました`, 'ok');
  } catch (e) { say(`書き出しに失敗: ${e.message || e}`, 'ng'); }
};

$('im-tags').onchange = async (ev) => {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    /* 新形式 {tags:[...]} と、旧diag.htmlの配列形式の両方に対応 */
    const rows = Array.isArray(data) ? data : data && Array.isArray(data.tags) ? data.tags : null;
    if (!rows) throw new Error('タグのバックアップ形式ではありません');
    const db = await openDb();
    if (!db.objectStoreNames.contains('tags')) { db.close(); throw new Error('tags ストアがありません'); }
    let put = 0, skip = 0;
    const tx = db.transaction(['posts', 'tags'], 'readwrite');
    const posts = tx.objectStore('posts'), tags = tx.objectStore('tags');
    for (const r of rows) {
      const ok = r && typeof r.postId === 'string' && Array.isArray(r.tags) && r.tags.every((t) => typeof t === 'string');
      if (!ok || !r.tags.length) { skip++; continue; }
      if (!(await req(posts.getKey(r.postId)))) { skip++; continue; }
      tags.put({ postId: r.postId, tags: r.tags.slice(0, 10), updatedAt: r.updatedAt || Date.now() });
      put++;
    }
    await new Promise((ok, ng) => { tx.oncomplete = ok; tx.onerror = () => ng(tx.error); tx.onabort = () => ng(tx.error); });
    db.close();
    say(`復元 ${put}件 / スキップ ${skip}件(投稿が無い・形式不正)`, put ? 'ok' : 'ng');
    refresh();
  } catch (e) { say(`復元に失敗: ${e.message || e}`, 'ng'); }
};

refresh();
</script>
</body>
</html>
