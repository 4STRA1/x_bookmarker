<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- スマホでも「PC版サイト」と同じ大きさ感にするため幅1060で描画。入力欄タップ時の自動ズームを防ぐため拡大は禁止
       (画像の拡大表示中だけ app.js が拡大を許可する) -->
  <meta id="vp" name="viewport" content="width=1060, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#161b2e">
  <!-- X の画像・動画CDNへリファラを送らない (動画URLがリファラ次第で拒否されるのを防ぐ) -->
  <meta name="referrer" content="no-referrer">
  <title>Xブックマークビューア</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">

    <!-- ヘッダー -->
    <header class="top">
      <div class="brand">
        <h1>ブックマークビューア</h1>
        <p id="total-count" class="sub">保存済み 0件</p>
      </div>
      <div class="top-actions">
        <button id="btn-import" class="btn btn-primary" type="button">JSONを読み込む</button>
        <input id="file-input" type="file" accept=".json,application/json" multiple hidden>
      </div>
    </header>

    <div id="status" class="status" role="status" hidden></div>
    <div id="fatal" class="fatal" role="alert" hidden></div>
    <div id="master-note" class="note" role="status" hidden></div>

    <!-- 検索・絞り込み（並び替えとは分離） -->
    <details id="search" class="panel">
      <summary>
        <span>検索・絞り込み</span>
        <span id="filter-badge" class="badge" hidden>0</span>
      </summary>

      <form id="search-form" autocomplete="off">
        <div class="field">
          <label for="s-user">ユーザー</label>
          <input id="s-user" type="search" placeholder="名前または @ID" enterkeyhint="search">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="s-from">開始日</label>
            <input id="s-from" type="date">
          </div>
          <div class="field">
            <label for="s-to">終了日</label>
            <input id="s-to" type="date">
          </div>
        </div>

        <fieldset class="field">
          <legend>メディア</legend>
          <div class="seg">
            <label><input type="radio" name="media" value="all" checked><span>指定なし</span></label>
            <label><input type="radio" name="media" value="image"><span>画像のみ</span></label>
            <label><input type="radio" name="media" value="video"><span>動画のみ</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label for="s-tag">タグ</label>
          <div id="s-tag-chips" class="chip-row"></div>
          <div id="s-tag-field" class="tag-field">
            <input id="s-tag" type="text" placeholder="タグを入力（候補から選択 / Enterで追加）" enterkeyhint="done">
            <div id="s-tag-suggest" class="chip-row sug-row" hidden></div>
          </div>
          <details id="s-tag-all" class="tag-all">
            <summary>付与済みタグ一覧（件数順） <span id="s-tag-all-n" class="badge">0</span></summary>
            <div id="s-tag-all-list" class="chip-row tag-all-list"></div>
          </details>
        </div>

        <fieldset class="field">
          <legend>複数タグの条件</legend>
          <div class="seg">
            <label><input type="radio" name="tagmode" value="and" checked><span>すべて含む（AND）</span></label>
            <label><input type="radio" name="tagmode" value="or"><span>どれか含む（OR）</span></label>
          </div>
        </fieldset>

        <div class="form-actions">
          <button id="btn-reset" class="btn" type="button">条件をクリア</button>
        </div>
      </form>
    </details>

    <!-- 並び替え -->
    <div class="sortbar">
      <span id="sort-label" class="sort-label">並び順</span>
      <div class="seg" role="radiogroup" aria-labelledby="sort-label">
        <label><input type="radio" name="sort" value="new" checked><span>新しい順</span></label>
        <label><input type="radio" name="sort" value="old"><span>古い順</span></label>
      </div>
    </div>

    <!-- タブ -->
    <nav class="tabs" role="tablist" aria-label="投稿の種類">
      <button id="tab-tagged" class="tab" role="tab" type="button" data-tab="tagged" aria-selected="true">タグ設定済(<span class="n">0</span>)</button>
      <button id="tab-untagged" class="tab" role="tab" type="button" data-tab="untagged" aria-selected="false">タグ未設定(<span class="n">0</span>)</button>
      <button id="tab-quick" class="tab" role="tab" type="button" data-tab="quick" aria-selected="false">高速タグ付与</button>
    </nav>

    <div id="list-top" class="list-top"></div>
    <div id="pager-top" class="pager" hidden></div>

    <main id="list" class="list" role="tabpanel" aria-labelledby="tab-tagged"></main>

    <div id="empty" class="empty" hidden>
      <p id="empty-msg" class="empty-msg">投稿一覧に表示させる投稿がありません</p>
      <p id="empty-hint" class="empty-hint"></p>
    </div>

    <div id="pager-bottom" class="pager" hidden></div>

    <!-- 高速タグ付与 (専用UI) -->
    <section id="quick" class="quick" role="tabpanel" aria-labelledby="tab-quick" hidden>
      <div id="q-main" class="q-main">
        <div class="q-head">
          <div>
            <div id="q-progress" class="q-progress" aria-live="polite">0 / 0</div>
            <div id="q-sub" class="q-sub"></div>
          </div>
          <button id="q-exit" class="btn btn-sm" type="button">高速タグ付与を終了</button>
        </div>

        <div id="q-post" class="q-post"></div>

        <nav id="q-crumbs" class="q-crumbs" aria-label="タグのカテゴリ"></nav>

        <div class="q-current">
          <div id="q-cur" class="q-cur"></div>
          <span id="q-count" class="counter">0 / 10</span>
        </div>

        <div id="q-cands" class="q-cands">
          <input id="q-filter" type="search" placeholder="候補を絞り込み（別名も可）" autocomplete="off">
          <div id="q-cands-list"></div>
        </div>

        <div class="q-manual">
          <div class="add-row">
            <input id="q-manual" type="text" placeholder="手動タグ（10文字まで・カンマで複数）" enterkeyhint="done" autocomplete="off">
            <button id="q-manual-add" class="btn btn-primary" type="button">追加</button>
          </div>
          <p id="q-error" class="error" role="alert" hidden></p>
        </div>

        <div class="q-foot">
          <button id="q-skip" class="btn" type="button">スキップ</button>
          <button id="q-next" class="btn" type="button">次カテゴリ →</button>
          <button id="q-save" class="btn btn-primary" type="button">保存して次の投稿 →</button>
        </div>
      </div>
      <div id="q-done" class="q-done empty" hidden></div>
    </section>
  </div>

  <!-- タグ編集 -->
  <dialog id="tag-dialog" class="sheet" aria-labelledby="tag-title">
    <div class="dlg-head">
      <h2 id="tag-title" tabindex="-1" autofocus>タグを編集</h2>
      <p id="tag-post-hint" class="dlg-sub"></p>
    </div>
    <div class="dlg-body">
      <div class="dlg-block">
        <div class="dlg-row">
          <h3>この投稿のタグ</h3>
          <span id="tag-counter" class="counter">0 / 10</span>
        </div>
        <div id="tag-current" class="chip-row"></div>
      </div>

      <div class="dlg-block">
        <label class="dlg-label" for="tag-input">タグを追加</label>
        <div class="add-row">
          <input id="tag-input" type="text" placeholder="10文字まで。カンマで複数追加" enterkeyhint="done" autocomplete="off">
          <button id="tag-add" class="btn btn-primary" type="button">追加</button>
        </div>
        <p id="tag-error" class="error" role="alert" hidden></p>
      </div>

      <div class="dlg-block">
        <h3>JSONタグから選ぶ</h3>
        <input id="tag-filter" type="search" placeholder="候補を絞り込み（別名も可）" autocomplete="off">
        <div id="tag-master" class="pick-master"></div>
      </div>

      <div class="dlg-block">
        <h3>使用済みのタグから選ぶ</h3>
        <div id="tag-existing" class="chip-row pick-row"></div>
      </div>
    </div>
    <div class="dlg-foot">
      <button id="tag-cancel" class="btn" type="button">キャンセル</button>
      <button id="tag-save" class="btn btn-primary" type="button">保存</button>
    </div>
  </dialog>

  <!-- 画像拡大 -->
  <dialog id="lightbox" aria-label="画像の拡大表示">
    <div class="lb-bar">
      <div class="lb-info">
        <span id="lb-post" class="lb-count"></span>
        <span id="lb-imgnav" class="lb-imgnav" hidden>
          <button id="lb-iprev" class="btn btn-icon" type="button" aria-label="前の画像">‹</button>
          <span id="lb-count" class="lb-count"></span>
          <button id="lb-inext" class="btn btn-icon" type="button" aria-label="次の画像">›</button>
        </span>
      </div>
      <div class="lb-actions">
        <button id="lb-save" class="btn btn-primary" type="button">画像を保存</button>
        <button id="lb-close" class="btn" type="button">閉じる</button>
      </div>
    </div>
    <div id="lb-stage" class="lb-stage">
      <button id="lb-prev" class="lb-nav lb-prev" type="button" aria-label="前の投稿">‹</button>
      <img id="lb-img" alt="拡大した画像" decoding="async" referrerpolicy="no-referrer">
      <p id="lb-msg" class="lb-msg" hidden>ファイルの読み込みに失敗しました</p>
      <button id="lb-next" class="lb-nav lb-next" type="button" aria-label="次の投稿">›</button>
    </div>
  </dialog>

  <!-- 読み込み結果 -->
  <dialog id="import-dialog" class="sheet" aria-labelledby="import-title">
    <div class="dlg-head">
      <h2 id="import-title" tabindex="-1" autofocus>読み込み結果</h2>
    </div>
    <div id="import-body" class="dlg-body"></div>
    <div class="dlg-foot">
      <button id="import-close" class="btn btn-primary" type="button">閉じる</button>
    </div>
  </dialog>

  <!-- 確認 -->
  <dialog id="confirm-dialog" class="sheet" aria-labelledby="confirm-msg">
    <div class="dlg-head">
      <h2 id="confirm-msg" tabindex="-1" autofocus></h2>
    </div>
    <div class="dlg-foot">
      <button id="confirm-cancel" class="btn" type="button">キャンセル</button>
      <button id="confirm-ok" class="btn btn-primary" type="button">OK</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
